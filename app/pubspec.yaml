name: printlocker_app
description: PrintLocker user app - print a PDF at a kiosk and collect it with a QR code or PIN.
publish_to: none
version: 0.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: any
  web_socket_channel: any
  file_picker: any
  qr_flutter: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
