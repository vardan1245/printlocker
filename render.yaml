# Render Blueprint: backend API + PostgreSQL + one simulated kiosk (demo/test setup).
# Free plan: services sleep after ~15 min without visits; the first visit wakes them (~1 min).
# Database: Neon Free (project "printlocker", aws-us-west-2); PL_DATABASE_URL is set in the dashboard.

services:
  - type: web
    name: printlocker-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: PL_DATABASE_URL
        sync: false # Neon connection string (postgresql://...?sslmode=require)
      - key: PL_JWT_SECRET
        generateValue: true
      - key: PL_FILE_KEY
        generateValue: true
      - key: PL_DEMO_KIOSK_KEY
        generateValue: true
      - key: PL_ADMIN_EMAIL
        value: admin@printlocker.local
      - key: PL_ADMIN_PASSWORD
        sync: false
      - key: PL_STORAGE_BACKEND
        value: db # PDFs as encrypted rows: the free web service's disk is wiped on every restart

  - type: web
    name: printlocker-kiosk-sim
    runtime: docker
    plan: free
    rootDir: kiosk-agent
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PL_KIOSK_KEY
        fromService:
          type: web
          name: printlocker-api
          envVarKey: PL_DEMO_KIOSK_KEY
      - key: PL_SERVER_URL
        sync: false # https://<printlocker-api host>.onrender.com/api/v1
      - key: PL_PRINTER_MODE
        value: sim
      - key: PL_HARDWARE_MODE
        value: twin # controller twin: real geometry, timings, interlocks
