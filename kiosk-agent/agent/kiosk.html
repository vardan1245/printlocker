<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
<title>PrintLocker kiosk</title>
<!-- Designed for the kiosk's 7" touchscreen: 800 x 480 px, landscape, finger input. -->
<style>
  :root { --bg:#f6f5f2; --ink:#1d1d1b; --quiet:#6b6a65; --line:#d6d4cc; --accent:#2f6fd6; --good:#2e8b57; --bad:#c0392b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; width:100%; height:100%; }
  body { font:20px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; overflow:hidden; }
  .bar { height:44px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 20px;
         font-size:16px; color:var(--quiet); border-bottom:1px solid var(--line); background:#fff; }
  .bar b { color:var(--ink); font-weight:600; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; }
  .view { flex:1; display:none; align-items:center; justify-content:center; gap:36px; padding:16px 28px; }
  .view.on { display:flex; }
  .col { display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:34px; line-height:1.15; margin:0; }
  .sub { color:var(--quiet); font-size:19px; margin:0; max-width:400px; }
  button { font-family:inherit; cursor:pointer; touch-action:manipulation; }
  button:active { transform:scale(.97); }
  .big-btn { font-size:22px; font-weight:600; height:68px; padding:0 30px; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink); }

  /* idle */
  .scanner { width:210px; height:210px; flex:none; border-radius:24px; border:4px dashed var(--accent); display:flex; align-items:center; justify-content:center; background:#fff; }
  .paste { display:none; gap:8px; }
  .paste.on { display:flex; }
  .paste input { font:15px ui-monospace,Menlo,monospace; height:44px; padding:0 10px; border:1px solid var(--line); border-radius:8px; width:250px; user-select:text; }
  .paste button { font-size:16px; height:44px; padding:0 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; }
  #scan-input { position:absolute; left:-9999px; opacity:0; }

  /* PIN: boxes left, keypad right */
  .pins { display:flex; gap:10px; }
  .pins div { width:50px; height:64px; border-radius:10px; border:2px solid var(--line); background:#fff;
              font:700 34px/60px ui-monospace,Menlo,monospace; text-align:center; }
  .pins div.filled { border-color:var(--accent); }
  .err-text { color:var(--bad); font-size:19px; min-height:26px; font-weight:600; }
  .pad { display:grid; grid-template-columns:repeat(3, 104px); grid-auto-rows:84px; gap:10px; }
  .pad button { font-size:34px; font-weight:600; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink); }
  .pad .ok { background:var(--accent); color:#fff; border-color:var(--accent); font-size:26px; }
  .pad .del { font-size:28px; color:var(--quiet); }

  /* results */
  .ring { width:150px; height:150px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:84px; color:#fff; font-weight:700; }
  .ring.good { background:var(--good); } .ring.bad { background:var(--bad); }
  .slot { font-size:96px; line-height:1; font-weight:800; color:var(--good); }
</style>
</head>
<body>
<div class="bar"><b id="kname">PrintLocker</b><span><span class="dot" id="odot" style="background:#aaa"></span><span id="otext">starting…</span></span></div>

<section class="view on" id="v-idle">
  <div class="scanner">
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#2f6fd6" stroke-width="1.5" stroke-linecap="round">
      <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/>
      <path d="M15 15h2v2h-2zM19 15h2M15 19h2M19 19h2v2M17 17h2v2"/></svg>
  </div>
  <div class="col">
    <h1>Scan your QR code</h1>
    <p class="sub">Hold the QR code from the PrintLocker app under the scanner below this screen.</p>
    <div><button class="big-btn" id="to-pin">Enter PIN instead</button></div>
    <div class="paste" id="paste">
      <input id="paste-input" placeholder="Simulator: paste QR text">
      <button id="paste-btn">Scan</button>
    </div>
  </div>
  <input id="scan-input" autocomplete="off">
</section>

<section class="view" id="v-pin">
  <div class="col" style="width:330px">
    <h1 style="font-size:30px">Enter your PIN</h1>
    <p class="sub" style="font-size:17px">6 digits, shown in the app with your QR code.</p>
    <div class="pins" id="pins"></div>
    <div class="err-text" id="pin-err"></div>
    <div><button class="big-btn" id="pin-cancel" style="height:56px;font-size:19px">&larr; Back</button></div>
  </div>
  <div class="pad" id="pad"></div>
</section>

<section class="view" id="v-open">
  <div class="ring good">&#10003;</div>
  <div class="col">
    <div class="sub" id="open-label" style="font-size:22px">Compartment</div>
    <div class="slot" id="open-slots"></div>
    <h1 style="font-size:28px;max-width:420px">Take your documents and close the door</h1>
  </div>
</section>

<section class="view" id="v-thanks">
  <div class="ring good">&#10003;</div>
  <h1 style="font-size:44px">Thank you!</h1>
</section>

<section class="view" id="v-error">
  <div class="ring bad">!</div>
  <div class="col" style="max-width:440px">
    <h1 style="font-size:30px" id="error-text">Code not recognised</h1>
    <p class="sub" id="error-sub"></p>
    <div><button class="big-btn" id="error-back" style="height:56px;font-size:19px">OK</button></div>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const SIM = new URLSearchParams(location.search).has('sim');
if (SIM) $('#paste').classList.add('on');
let view = 'idle', pin = '', backTimer = null, openSince = 0;

function show(v) {
  view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  clearTimeout(backTimer);
  if (v === 'idle') { pin = ''; drawPin(); focusScanner(); }
  if (v === 'error' || v === 'thanks') backTimer = setTimeout(() => show('idle'), v === 'thanks' ? 3000 : 6000);
  if (v === 'pin') backTimer = setTimeout(() => show('idle'), 60000);
}

function focusScanner() { if (view === 'idle' && document.activeElement !== $('#paste-input')) $('#scan-input').focus({ preventScroll: true }); }

async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { return { ok: false, message: 'The kiosk is not responding. Please try again.' }; }
}

function handle(res) {
  if (res.ok) {
    $('#open-label').textContent = res.slots.length > 1 ? 'Compartments' : 'Compartment';
    $('#open-slots').textContent = res.slots.map(s => '#' + s).join(' ');
    openSince = Date.now();
    show('open');
  } else {
    $('#error-text').textContent = res.message || 'Code not recognised';
    $('#error-sub').textContent = res.locked_seconds ? `PIN entry is locked for ${Math.ceil(res.locked_seconds / 60)} min. You can still scan your QR code.` : '';
    show('error');
  }
}

// A USB QR scanner types the code like a keyboard and presses Enter.
$('#scan-input').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim(); e.target.value = '';
  if (code) handle(await post('/api/qr', { code }));
});
$('#paste-btn').onclick = async () => {
  const code = $('#paste-input').value.trim(); $('#paste-input').value = '';
  if (code) handle(await post('/api/qr', { code }));
};
$('#paste-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#paste-btn').click(); });
document.addEventListener('click', () => setTimeout(focusScanner, 50));

// PIN pad
function drawPin() { $('#pins').innerHTML = [0,1,2,3,4,5].map(i => `<div class="${i < pin.length ? 'filled' : ''}">${i < pin.length ? '&bull;' : ''}</div>`).join(''); }
$('#pad').innerHTML = ['1','2','3','4','5','6','7','8','9','del','0','ok'].map(k =>
  `<button data-k="${k}" class="${k}">${k === 'del' ? '&#9003;' : k === 'ok' ? 'OK' : k}</button>`).join('');
$('#pad').addEventListener('click', async (e) => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return;
  $('#pin-err').textContent = '';
  if (k === 'del') pin = pin.slice(0, -1);
  else if (k === 'ok') {
    if (pin.length !== 6) { $('#pin-err').textContent = 'The PIN has 6 digits.'; return; }
    const res = await post('/api/pin', { pin }); pin = ''; drawPin();
    if (!res.ok && !res.locked_seconds && view === 'pin') { $('#pin-err').textContent = res.message; return; }
    handle(res); return;
  } else if (pin.length < 6) pin += k;
  drawPin();
  clearTimeout(backTimer); backTimer = setTimeout(() => show('idle'), 60000);
});
$('#to-pin').onclick = () => { pin = ''; drawPin(); $('#pin-err').textContent = ''; show('pin'); };
$('#pin-cancel').onclick = () => show('idle');
$('#error-back').onclick = () => show('idle');

// Status: online dot, and leave the "open" screen once every door is closed again.
async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    $('#kname').textContent = s.kiosk || 'PrintLocker';
    $('#odot').style.background = !s.ready ? '#aaa' : s.online ? 'var(--good)' : 'var(--bad)';
    $('#otext').textContent = !s.ready ? 'starting…' : s.online ? 'online' : 'offline · pickup still works';
    if (view === 'open' && Date.now() - openSince > 1500 && (!s.open_slots || s.open_slots.length === 0)) show('thanks');
  } catch (e) { $('#otext').textContent = 'not responding'; }
  setTimeout(poll, 1000);
}
drawPin(); poll(); focusScanner();
</script>
</body>
</html>
