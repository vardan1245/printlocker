<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PrintLocker kiosk</title>
<style>
  :root { --bg:#f6f5f2; --ink:#1d1d1b; --quiet:#6b6a65; --line:#dcdad3; --accent:#2f6fd6; --good:#2e8b57; --bad:#c0392b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; }
  body { font:18px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; overflow:hidden; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; font-size:14px; color:var(--quiet); border-bottom:1px solid var(--line); background:#fff; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:0; }
  .view { flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center; gap:14px; }
  .view.on { display:flex; }
  h1 { font-size:30px; margin:0; }
  .sub { color:var(--quiet); font-size:17px; margin:0; max-width:520px; }
  .big-btn { font:600 20px/1 inherit; font-family:inherit; padding:16px 28px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .big-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .scanner { width:120px; height:120px; border-radius:18px; border:3px dashed var(--accent); display:flex; align-items:center; justify-content:center; }
  .paste { display:none; gap:8px; margin-top:4px; }
  .paste.on { display:flex; }
  .paste input { font:15px ui-monospace,Menlo,monospace; padding:10px; border:1px solid var(--line); border-radius:8px; width:300px; user-select:text; }
  .paste button { font:inherit; font-size:15px; padding:10px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; }
  #scan-input { position:absolute; left:-9999px; opacity:0; }
  .pins { display:flex; gap:10px; }
  .pins div { width:36px; height:46px; border-bottom:3px solid var(--line); font:600 30px/46px ui-monospace,Menlo,monospace; }
  .pins div.filled { border-color:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3, 84px); gap:8px; }
  .pad button { height:56px; font:600 24px/1 inherit; font-family:inherit; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .pad button:active, .big-btn:active { transform:scale(.97); }
  .pad .ok { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ring { width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:48px; color:#fff; }
  .ring.good { background:var(--good); } .ring.bad { background:var(--bad); }
  .slot { font:700 64px/1 inherit; font-family:inherit; color:var(--good); }
  .err-text { color:var(--bad); font-size:16px; min-height:20px; }
</style>
</head>
<body>
<div class="bar"><span id="kname">PrintLocker</span><span><span class="dot" id="odot" style="background:#aaa"></span><span id="otext">starting…</span></span></div>

<section class="view on" id="v-idle">
  <div class="scanner">
    <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#2f6fd6" stroke-width="1.6" stroke-linecap="round">
      <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/>
      <path d="M15 15h2v2h-2zM19 15h2M15 19h2M19 19h2v2M17 17h2v2"/></svg>
  </div>
  <h1>Scan your QR code</h1>
  <p class="sub">Hold the QR code from the PrintLocker app under the scanner.</p>
  <button class="big-btn" id="to-pin">Enter PIN instead</button>
  <div class="paste" id="paste">
    <input id="paste-input" placeholder="Simulator: paste QR text here">
    <button id="paste-btn">Scan</button>
  </div>
  <input id="scan-input" autocomplete="off">
</section>

<section class="view" id="v-pin">
  <h1 style="font-size:24px">Enter your 6-digit PIN</h1>
  <div class="pins" id="pins"></div>
  <div class="err-text" id="pin-err"></div>
  <div class="pad" id="pad"></div>
  <button class="big-btn" id="pin-cancel" style="padding:10px 22px;font-size:16px">Back</button>
</section>

<section class="view" id="v-open">
  <div class="ring good">&#10003;</div>
  <div class="sub" id="open-label">Compartment</div>
  <div class="slot" id="open-slots"></div>
  <h1 style="font-size:24px">Take your documents and close the door</h1>
</section>

<section class="view" id="v-thanks">
  <div class="ring good">&#10003;</div>
  <h1>Thank you!</h1>
</section>

<section class="view" id="v-error">
  <div class="ring bad">!</div>
  <h1 style="font-size:24px" id="error-text">Code not recognised</h1>
  <p class="sub" id="error-sub"></p>
</section>

<script>
const $ = (s) => document.querySelector(s);
const SIM = new URLSearchParams(location.search).has('sim');
if (SIM) $('#paste').classList.add('on');
let view = 'idle', pin = '', backTimer = null, openSince = 0;

function show(v) {
  view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  clearTimeout(backTimer);
  if (v === 'idle') { pin = ''; drawPin(); focusScanner(); }
  if (v === 'error' || v === 'thanks') backTimer = setTimeout(() => show('idle'), v === 'thanks' ? 3000 : 5000);
  if (v === 'pin') backTimer = setTimeout(() => show('idle'), 60000);
}

function focusScanner() { if (view === 'idle' && document.activeElement !== $('#paste-input')) $('#scan-input').focus(); }

async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { return { ok: false, message: 'The kiosk is not responding. Please try again.' }; }
}

function handle(res) {
  if (res.ok) {
    $('#open-label').textContent = res.slots.length > 1 ? 'Compartments' : 'Compartment';
    $('#open-slots').textContent = res.slots.map(s => '#' + s).join('  ');
    openSince = Date.now();
    show('open');
  } else {
    $('#error-text').textContent = res.message || 'Code not recognised';
    $('#error-sub').textContent = res.locked_seconds ? `PIN entry is locked for ${Math.ceil(res.locked_seconds / 60)} min. You can still use your QR code.` : '';
    show('error');
  }
}

// A USB QR scanner types the code like a keyboard and presses Enter.
$('#scan-input').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim(); e.target.value = '';
  if (code) handle(await post('/api/qr', { code }));
});
$('#paste-btn').onclick = async () => {
  const code = $('#paste-input').value.trim(); $('#paste-input').value = '';
  if (code) handle(await post('/api/qr', { code }));
};
$('#paste-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#paste-btn').click(); });
document.addEventListener('click', () => setTimeout(focusScanner, 50));

// PIN pad
function drawPin() { $('#pins').innerHTML = [0,1,2,3,4,5].map(i => `<div class="${i < pin.length ? 'filled' : ''}">${i < pin.length ? '&bull;' : ''}</div>`).join(''); }
$('#pad').innerHTML = ['1','2','3','4','5','6','7','8','9','&#9003;','0','OK'].map(k =>
  `<button data-k="${k === '&#9003;' ? 'del' : k}" class="${k === 'OK' ? 'ok' : ''}">${k}</button>`).join('');
$('#pad').addEventListener('click', async (e) => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return;
  $('#pin-err').textContent = '';
  if (k === 'del') pin = pin.slice(0, -1);
  else if (k === 'OK') {
    if (pin.length !== 6) { $('#pin-err').textContent = 'The PIN has 6 digits.'; return; }
    const res = await post('/api/pin', { pin }); pin = ''; drawPin();
    if (!res.ok && !res.locked_seconds && view === 'pin') { $('#pin-err').textContent = res.message; return; }
    handle(res); return;
  } else if (pin.length < 6) pin += k;
  drawPin();
  clearTimeout(backTimer); backTimer = setTimeout(() => show('idle'), 60000);
});
$('#to-pin').onclick = () => { pin = ''; drawPin(); $('#pin-err').textContent = ''; show('pin'); };
$('#pin-cancel').onclick = () => show('idle');

// Status: online dot, and leave the "open" screen once every door is closed again.
async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    $('#kname').textContent = s.kiosk || 'PrintLocker';
    $('#odot').style.background = !s.ready ? '#aaa' : s.online ? 'var(--good)' : 'var(--bad)';
    $('#otext').textContent = !s.ready ? 'starting…' : s.online ? 'online' : 'offline (pickup still works)';
    if (view === 'open' && Date.now() - openSince > 1500 && (!s.open_slots || s.open_slots.length === 0)) show('thanks');
  } catch (e) { $('#otext').textContent = 'not responding'; }
  setTimeout(poll, 1000);
}
drawPin(); poll(); focusScanner();
</script>
</body>
</html>
