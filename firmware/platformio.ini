; PrintLocker controller firmware.
;   pio run -e esp32dev              build for the board
;   pio run -e esp32dev -t upload    flash over USB
;   make test                        PC build + acceptance tests (no board needed)
[platformio]
src_dir = src
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
build_src_filter = +<core/> +<esp32/>
lib_deps =
  gin66/FastAccelStepper
  teemuatlut/TMCStepper
  adafruit/Adafruit MCP23017 Arduino Library
  adafruit/Adafruit NeoPixel
