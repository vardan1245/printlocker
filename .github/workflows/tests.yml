name: Backend and kiosk tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "kiosk-agent/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -rs

  kiosk-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q -rs
