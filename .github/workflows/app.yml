name: Flutter app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are not committed; generate them (keeps lib/ and pubspec untouched).
      - name: Create platform folders
        run: flutter create . --platforms=android,web --org am.printlocker --project-name printlocker_app

      # Release builds need the internet permission explicitly.
      - name: Android internet permission
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $f || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $f
          grep -n 'INTERNET' $f

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: printlocker-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: printlocker-web
          path: app/build/web
