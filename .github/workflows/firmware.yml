name: Firmware
on:
  push:
    paths: ["firmware/**", "kiosk-agent/agent/twin.py", "kiosk-agent/tests/test_controller_protocol.py", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

jobs:
  pc-build-acceptance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - name: Build the firmware for the PC (simulated board) and run the controller acceptance tests
        working-directory: firmware
        run: make test

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compile for the ESP32 DevKit
        working-directory: firmware
        run: pio run -e esp32dev
      - uses: actions/upload-artifact@v4
        with:
          name: printlocker-esp32-firmware
          path: firmware/.pio/build/esp32dev/firmware.bin
